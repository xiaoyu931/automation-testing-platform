checkout_cases:

  - case_name: checkout success
    username: standard_user
    password: secret_sauce
    first_name: John
    last_name: Doe
    zip: 12345
    expected_message: "Thank you for your order!"

  - case_name: missing first name
    username: standard_user
    password: secret_sauce
    first_name: ""
    last_name: Doe
    zip: 12345
    expected_message: "Error: First Name is required"

  - case_name: missing last name
    username: standard_user
    password: secret_sauce
    first_name: John
    last_name: ""
    zip: 12345
    expected_message: "Error: Last Name is required"

  - case_name: missing postal code
    username: standard_user
    password: secret_sauce
    first_name: John
    last_name: Doe
    zip: ""
    expected_message: "Error: Postal Code is required"
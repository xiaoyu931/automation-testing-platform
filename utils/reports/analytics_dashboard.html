
<!DOCTYPE html>
<html>

<head>

<title>Test Analytics Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
margin:40px;
background:#f5f5f5;
}

h1{
color:#333;
}

.card{
background:white;
padding:20px;
margin:10px;
border-radius:8px;
box-shadow:0px 2px 5px rgba(0,0,0,0.1);
display:inline-block;
width:200px;
text-align:center;
}

.chart-container{
width:700px;
margin-top:40px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
border:1px solid #ddd;
padding:8px;
}

th{
background:#4CAF50;
color:white;
}

</style>

</head>


<body>

<h1>Test Analytics Dashboard</h1>

<div class="card">
<h2>Total Tests</h2>
<p>0</p>
</div>

<div class="card">
<h2>Passed</h2>
<p>0</p>
</div>

<div class="card">
<h2>Failed</h2>
<p>0</p>
</div>

<div class="card">
<h2>Success Rate</h2>
<p>0%</p>
</div>

<div class="card">
<h2>Avg Duration</h2>
<p>0s</p>
</div>

<div class="card">
<h2>Flaky Tests</h2>
<p>0</p>
</div>


<h2>Test Status Distribution</h2>

<div class="chart-container">
<canvas id="statusChart"></canvas>
</div>


<h2>Module Stability</h2>

<div class="chart-container">
<canvas id="moduleChart"></canvas>
</div>


<h2>Slowest Test Cases</h2>

<div class="chart-container">
<canvas id="slowChart"></canvas>
</div>


<h2>Success Rate Trend</h2>

<div class="chart-container">
<canvas id="trendChart"></canvas>
</div>


<h2>Slowest Test Cases Table</h2>

<table>

<tr>
<th>Module</th>
<th>Case</th>
<th>Duration</th>
</tr>
</table>
<h2>Module Success Rate</h2>

<table>

<tr>
<th>Module</th>
<th>Success Rate</th>
</tr>
</table>

<script>

// pass / fail pie
new Chart(
document.getElementById('statusChart'),
{
type:'pie',
data:{
labels:['Passed','Failed'],
datasets:[{
data:[0,0],
backgroundColor:['#4CAF50','#F44336']
}]
}
}
);


// module stability
new Chart(
document.getElementById('moduleChart'),
{
type:'bar',
data:{
labels:[],
datasets:[{
label:'Success Rate',
data:[],
backgroundColor:'#2196F3'
}]
},
options:{
scales:{
y:{
beginAtZero:true,
max:100
}
}
}
}
);


// slow tests
new Chart(
document.getElementById('slowChart'),
{
type:'bar',
data:{
labels:[],
datasets:[{
label:'Duration (s)',
data:[],
backgroundColor:'#FF9800'
}]
}
}
);


// success trend
new Chart(
document.getElementById('trendChart'),
{
type:'line',
data:{
labels:['2026-03-15 22:33:47', '2026-03-15 22:33:52'],
datasets:[{
label:'Success Rate',
data:[0, 0],
borderColor:'#4CAF50',
fill:false
}]
}
}
);

</script>

</body>

</html>
